name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup 7
        shell: pwsh
        run: |
          # build.ps1 looks for %LOCALAPPDATA%\Programs\Inno Setup 7\ISCC.exe
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe'
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-x64.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 7'
          Start-Process -FilePath $installer `
            -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /DIR=`"$dir`"" -Wait
          if (-not (Test-Path (Join-Path $dir 'ISCC.exe'))) { throw 'Inno Setup install failed' }

      - name: Build + run tests + build installer
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\build.ps1 -Tests -Installer

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShakeShake-Setup
          path: dist/ShakeShake-*-Setup.exe
          if-no-files-found: error

      # 打 tag（v1.2.0 这种）时把安装包和说明挂到 Releases。
      # 注意：GitHub 会把非 ASCII 的资产名改写成 default.<ext>，所以这里统一用 ASCII 文件名。
      - name: Prepare release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Copy-Item dist\ShakeShake-*-Setup.exe . -Force
          Copy-Item dist\使用说明.txt ShakeShake-Manual.txt
          Get-ChildItem ShakeShake-*-Setup.exe, ShakeShake-Manual.txt | Select-Object Name, Length

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ShakeShake-*-Setup.exe
            ShakeShake-Manual.txt
          generate_release_notes: true

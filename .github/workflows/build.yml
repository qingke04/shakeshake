name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build + run tests
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\build.ps1 -Tests

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShakeShake
          path: dist/ShakeShake.exe
          if-no-files-found: error

      # 打 tag（v1.1.1 这种）时把 exe 改名后直接挂到 Releases，无需解压
      # 注意：GitHub 会把非 ASCII 的资产名改写成 default.<ext>，所以这里统一用 ASCII 文件名上传
      - name: Prepare release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Copy-Item dist\ShakeShake.exe ShakeShake-x64.exe
          Copy-Item dist\使用说明.txt ShakeShake-Manual.txt
          Get-ChildItem ShakeShake-x64.exe, ShakeShake-Manual.txt | Select-Object Name, Length

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ShakeShake-x64.exe
            ShakeShake-Manual.txt
          generate_release_notes: true

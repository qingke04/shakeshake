name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build + run tests
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\build.ps1 -Tests

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShakeShake
          path: dist/ShakeShake.exe
          if-no-files-found: error

      # 打 tag（v1.1.1 这种）时自动打包并发布到 GitHub Releases
      - name: Package release zip
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist\ShakeShake.exe release\
          Copy-Item dist\使用说明.txt release\
          Compress-Archive -Path release\* -DestinationPath "ShakeShake-$tag.zip" -Force
          Get-Item "ShakeShake-$tag.zip" | Select-Object Name, Length

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ShakeShake-${{ github.ref_name }}.zip
          generate_release_notes: true
